version: 2

models:
  - name: src_customers
    description: >
      Project-owned source model for customers. One row per customer, keyed by id.
      Holds the raw customer rows that feed the stg_customers staging view.
    columns:
      - name: id
        description: Unique customer identifier.
      - name: customer_name
        description: Customer full name.
      - name: signup_date
        description: Date the customer signed up (ISO YYYY-MM-DD).
      - name: country
        description: Customer country (lowercase source value).

  - name: stg_customers
    description: >
      Staging model for customers. One row per customer, keyed by id.
      Casts signup_date to DATE and uppercases country.
    columns:
      - name: id
        description: Unique customer identifier.
        tests:
          - not_null
          - unique
      - name: customer_name
        description: Customer full name.
      - name: signup_date
        description: Date the customer signed up, cast to DATE.
      - name: country
        description: Customer country, uppercased.
