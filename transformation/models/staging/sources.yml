version: 2

sources:
  - name: raw
    schema: main
    tables:
      - name: customers
        description: Raw customer records seeded from customers.csv.
        columns:
          - name: id
            description: Customer primary key.
          - name: name
            description: Customer name.
          - name: signup_date
            description: Date the customer signed up.
          - name: country
            description: Customer country code.

      - name: sales
        description: Raw sales records seeded from sales.csv.
        columns:
          - name: id
            description: Sale primary key.
          - name: customer_id
            description: Foreign key to customers.
          - name: product
            description: Product name.
          - name: quantity
            description: Number of units sold.
          - name: unit_price
            description: Price per unit.
          - name: sale_date
            description: Date of sale.
          - name: region
            description: Sales region.
