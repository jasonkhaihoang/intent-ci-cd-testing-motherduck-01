# Publishes the prod dbt manifest artifact on push to main.
# Uses dbt_motherduck_compile (offline, database: <PROD_DB_NAME>) — no live MotherDuck connection required.
# Gate 1 of any subsequent PR downloads this artifact as the state:modified+ baseline.
# See docs/design/MotherDuck/motherduck-ci-workflow-design.md §prod-state-manifest, §Per-Domain production database name (AC-94, VD-5675)
name: Publish Prod Manifest (MotherDuck)

on:
  push:
    branches: [main]
  workflow_dispatch:

# AC-17: repo-wide (no ref component) because the resource this protects, dbt-docs-latest, is
# repo-wide too — a workflow_dispatch off any ref must still serialize against a main push.
# cancel-in-progress: false means an overlapping run queues rather than being cancelled
# mid-clobber. `queue: max` (GitHub's larger-queue-depth option, shipped 2026-05-07) is real
# GitHub syntax but is NOT used here: this repo's fake-world CI harness validates every
# workflow through a pinned `act` build (v0.2.86) whose bundled schema validator rejects
# `queue` as an unknown property under `concurrency` and hard-fails the entire workflow set
# for every deployed bundle -- confirmed live (act's own error: "Unknown Property queue").
# Accepted residual risk: without queue: max, GitHub's default keeps only the single newest
# pending run, so a third or later overlapping run could still be dropped rather than queued.
# Same treatment as this spec's pre-existing accepted concurrency gap (AC-DPL-38).
concurrency:
  group: publish-prod-manifest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: vars.FAKE_WORLD == ''

      - name: Resolve layout
        run: |
          echo "PROJ=$([ -f transformation/dbt_project.yml ] && echo transformation || echo .)" >> "$GITHUB_ENV"
          echo "CICFG=.workflow/ci-config.yml" >> "$GITHUB_ENV"

      # Matches ci.yml's established convention: actions/setup-python's toolcache is a
      # Docker volume act shares across separate invocations on the same host, so packages
      # pip-installed by an earlier fake-world test invocation persist into this one --
      # confirmed live (a leftover dbt-fabricspark from a prior test made
      # publish_manifest_release.py's adapter-detection see two candidates instead of one).
      # Skipping this under FAKE_WORLD and using the image's own system python3 avoids that
      # shared-volume carryover; real (non-fake-world) runs are unaffected.
      - if: vars.FAKE_WORLD == ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pre-existing gap, found live while validating VD-5839 end-to-end: the very next step
      # imports `ci_config.py`, which needs pyyaml, but nothing installed it -- every prior
      # `main` push silently relied on the runner image happening to have it, since real
      # ci-config.yml files here always parsed as valid YAML on whatever pyyaml version was
      # already present. Matches ci.yml's own established convention (`pip install pyyaml
      # --quiet` before the first step that needs it).
      - name: Install pyyaml
        run: pip install pyyaml --quiet

      - name: Resolve PROD_DB_NAME from ci-config.yml
        run: |
          python3 - <<'EOF'
          import os, sys
          sys.path.insert(0, ".github/scripts")
          from ci_config import parse_ci_config

          with open(os.environ["CICFG"]) as f:
              yaml_str = f.read()
          result = parse_ci_config(yaml_str)
          if not result["ok"]:
              print(f"ci-config.yml parse failed: {result['error']}", file=sys.stderr)
              sys.exit(1)
          prod_db_name = result["config"]["prod_db_name"]
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write(f"PROD_DB_NAME={prod_db_name}\n")
          EOF

      - name: Install dbt-duckdb
        run: |
          DUCKDB_VERSION=$(curl -fsSL https://motherduck.com/docs/duckdb-versions.json \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['duckdb']['motherduck_regions']['global']['max'])")
          pip install "dbt-duckdb" "duckdb==${DUCKDB_VERSION}" --quiet

      - name: Add fake-world dbt shim to PATH
        if: vars.FAKE_WORLD != ''
        run: echo "/fakeworld-shims" >> "$GITHUB_PATH"

      - name: Parse dbt project
        run: |
          dbt deps --project-dir "$PROJ" --quiet
          dbt parse --project-dir "$PROJ" --profiles-dir .github/profiles --profile dbt_motherduck_compile --target compile --quiet

      - name: Generate dbt Docs static site
        run: |
          dbt docs generate --project-dir "$PROJ" --profiles-dir .github/profiles --profile dbt_motherduck_compile --target compile --static --empty-catalog --no-compile --quiet

      # `dbt docs generate` rewrites target/manifest.json, but against the same
      # profile+target as the parse above, so no staging copy is needed here — unlike the
      # Fabric bundle, which parses a second time against a different (prod) target and
      # must therefore restore the selection manifest before publishing.
      #
      # The manifest rides the docs release rather than an Actions artifact (VD-4418):
      # release assets are repository contents, which the brokered agent GitHub token can
      # read, while `gh run download` needs Actions read and is unreachable from an Intent.
      # Only the selection name is published — the compile target is already the prod
      # database, so this one manifest serves both selection and `--defer --state`.
      # AC-14..AC-18: cut the immutable per-build release (dbt-manifest-<sha>) before the
      # dbt-docs-latest step below, so a failure here stops the job before the mutable release
      # advances. Also writes manifest-source.json into $PROJ/target so the dbt-docs-latest
      # publish step (next) picks it up as an asset too.
      # `github.event.after` (falling back to `github.sha` for workflow_dispatch, which has
      # no `.after`) rather than `github.sha` alone: confirmed live that this repo's
      # fake-world CI harness's push-event fixture leaves `github.sha` unresolved when the
      # deployed scratch copy isn't a git repo, silently rendering it empty and shifting
      # every argument after it. `github.event.after` reads directly from the event JSON
      # act was given, with no git-repo dependency.
      - name: Publish immutable per-build manifest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish_manifest_release.py "$PROJ/target" \
            ${{ github.event.after || github.sha }} manifest.json

      - name: Publish dbt Docs and prod manifest to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/publish_dbt_docs_release.py "$PROJ/target" \
            static_index.html manifest.json manifest-source.json
